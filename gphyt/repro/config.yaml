run_name: unet_s_baseline
seed: 0

data:
  data_dir: ~/.cache/gphyt_repro/corpus
  datasets:
    - advection
    - burgers
    - incompressible_ns
    - sine_gordon
  heldout_datasets:
    - wave
    - thermal_convection
  height: 64
  width: 32
  n_steps_input: 4
  n_steps_output: 2
  dt_stride: [1, 4]
  batch_size: 8
  num_workers: 0
  use_normalization: true
  include_fields:
    t0_fields: [pressure, density, temperature]
    t1_fields: [velocity]

model:
  architecture: unet
  model_size: UNet_S
  n_time_steps: 4
  integrate: false

training:
  steps: 2000
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 100
  grad_clip: 1.0
  log_every: 50
  eval_every: 500
  amp: auto
  device: auto

eval:
  horizons: [1, 2, 4, 8, 16, 24]
  max_rollout_steps: 24
  batch_size: 8
  single_step: true

output_dir: results/repro
