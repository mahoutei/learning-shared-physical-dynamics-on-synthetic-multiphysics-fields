run_name: gphyt_s_context_1
seed: 0

data:
  data_dir: ~/.cache/gphyt_repro/corpus
  datasets:
    - advection
    - burgers
    - incompressible_ns
    - sine_gordon
  heldout_datasets:
    - wave
    - thermal_convection
  height: 64
  width: 32
  n_steps_input: 1
  n_steps_output: 2
  dt_stride: [1, 4]
  batch_size: 8
  num_workers: 0
  use_normalization: true
  include_fields:
    t0_fields: [pressure, density, temperature]
    t1_fields: [velocity]

model:
  architecture: gphyt
  transformer:
    input_channels: 5
    model_size: GPT_S
    att_mode: full
    dropout: 0.0
    pos_enc_mode: absolute
    patch_size: [1, 16, 16]
    stochastic_depth_rate: 0.0
    use_derivatives: true
    integrator: Euler
  tokenizer:
    tokenizer_mode: linear
    detokenizer_mode: linear
    tokenizer_overlap: 0
    detokenizer_overlap: 0
  residual: true

training:
  steps: 2000
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 100
  grad_clip: 1.0
  log_every: 50
  eval_every: 500
  amp: auto
  device: auto

eval:
  horizons: [1, 2, 4, 8, 16, 24]
  max_rollout_steps: 24
  batch_size: 8
  single_step: true

output_dir: results/repro
